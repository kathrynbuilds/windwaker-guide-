<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Wind Waker Compass — an offline walkthrough and 100% completion tracker for The Legend of Zelda: The Wind Waker (GameCube).">
  <meta name="theme-color" content="#0a3d62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WW Compass">
  <title>Wind Waker Compass</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* Apply the saved theme BEFORE first paint so light-mode users never see
       a flash of the dark default. Mirrors js/store.js key + default. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('wwc.settings.v1') || '{}');
        var dark = s.darkMode === undefined ? true : s.darkMode;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* keep the dark default already on <html> */ }
    })();
  </script>
</head>
<body>
  <!-- Decorative ocean waves along the bottom of the screen -->
  <div class="sea-waves" aria-hidden="true">
    <svg viewBox="0 0 1200 80" preserveAspectRatio="none">
      <path class="wave wave-back" d="M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1200,70 1200,40 L1200,80 L0,80 Z"/>
      <path class="wave wave-front" d="M0,55 C200,25 400,80 600,50 C800,25 1000,80 1200,50 L1200,80 L0,80 Z"/>
    </svg>
  </div>

  <header class="app-header">
    <a href="#/dashboard" class="brand">
      <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <polygon points="24,10 28,24 24,38 20,24" fill="currentColor"/>
        <polygon points="10,24 24,20 38,24 24,28" fill="currentColor" opacity="0.55"/>
      </svg>
      <span>Wind Waker Compass</span>
    </a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark / light mode" title="Toggle dark / light mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="moon-path" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#/dashboard" data-nav="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 2 10h2v10h6v-6h4v6h6V10h2z" fill="currentColor"/></svg>
      <span>Home</span>
    </a>
    <a href="#/chapters" data-nav="chapters">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zm0 16h14a1 1 0 0 1 0 2H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
      <span>Chapters</span>
    </a>
    <a href="#/checklists" data-nav="checklists">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h3v3H4zm5 .5h11v2H9zM4 10.5h3v3H4zm5 .5h11v2H9zM4 16h3v3H4zm5 .5h11v2H9z" fill="currentColor"/></svg>
      <span>Checklists</span>
    </a>
    <a href="#/search" data-nav="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.4 12.5l4.5 4.5 1.6-1.6-4.5-4.5A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="currentColor"/></svg>
      <span>Search</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L16 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.4 2 1.6A7 7 0 0 0 7 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L12 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.4-2-1.6A7 7 0 0 0 21 12z" fill="currentColor" fill-rule="evenodd"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Data first, then the store, then the app (classic scripts, dependency order) -->
  <script src="js/data/collectibles.js"></script>
  <script src="js/data/chapters.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
